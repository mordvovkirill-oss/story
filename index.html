<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Наша история</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: one narrow column, like a page of a small book. One step on screen at a time. */
  color-scheme: light;
  --paper: #f8f4ed;
  --card: #fffcf8;
  --ink: #30262a;
  --muted: #78665f;
  --line: #d9cbbe;
  --wine: #862e48;
  --wine-soft: #f4e4ea;
  --todo: #ffe680;
  --display: "Lora", Georgia, serif;
  --body: "Lora", Georgia, serif;
  --hand: "Caveat", cursive;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
.page {
  max-width: 460px;
  margin: 0 auto;
  padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-height: 100dvh;
}
header { display: flex; flex-direction: column; gap: 12px; }
.brand {
  font-family: var(--display);
  font-size: 34px;
  font-weight: 600;
  line-height: 1.05;
  margin: 0;
  letter-spacing: 0.01em;
}
.steps { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  font-size: 13px;
  font-weight: 500;
  padding: 4px 11px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--muted);
  background: transparent;
}
.chip.now { border-color: var(--wine); color: var(--wine); background: var(--wine-soft); }
.chip.done { color: var(--ink); border-color: var(--ink); }
main {
  background: var(--card);
  border-radius: 10px;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-shadow: 0 1px 0 var(--line), 0 14px 30px -22px rgba(27, 29, 35, 0.45);
}
.eyebrow {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--wine);
  margin: 0;
}
h2 {
  font-family: var(--display);
  font-weight: 600;
  font-size: 30px;
  line-height: 1.12;
  margin: 0;
  text-wrap: balance;
}
p { margin: 0; }
.soft { color: var(--muted); font-size: 15px; }
.quote {
  font-family: var(--display);
  font-style: italic;
  font-size: 25px;
  line-height: 1.25;
  text-wrap: balance;
}
.todo {
  background: var(--todo);
  padding: 1px 5px;
  border-radius: 3px;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
.btn {
  align-self: stretch;
  background: var(--wine);
  color: #fff;
  border: 0;
  border-radius: 8px;
  min-height: 52px;
  padding: 12px 22px;
  font-weight: 600;
  font-size: 17px;
}
.btn:active { transform: translateY(1px); }
.btn.ghost {
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--line);
  font-weight: 500;
  min-height: 46px;
  padding: 8px 14px;
  font-size: 15px;
  border-radius: 8px;
}
.row > .btn { flex: 1 1 auto; }
.row > .count { flex: 0 0 auto; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--wine); outline-offset: 2px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* puzzle */
.board {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  background: var(--paper);
  border-radius: 8px;
  overflow: hidden;
}
.tile {
  position: absolute;
  width: 33.3334%;
  height: 33.3334%;
  padding: 0;
  border: 1.5px solid var(--card);
  border-radius: 3px;
  background-image: url("photo.jpg");
  background-size: 300% 300%;
  transition: left 0.16s ease, top 0.16s ease;
}
.tile span {
  display: none;
  position: absolute;
  left: 6px; top: 6px;
  min-width: 24px; height: 24px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.92);
  color: var(--ink);
  font-size: 14px;
  font-weight: 600;
  line-height: 24px;
  text-align: center;
}
.board.nums .tile span { display: block; }
.photo { width: 100%; border-radius: 8px; display: block; }
.count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* questions */
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  text-align: left;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  min-height: 52px;
  padding: 12px 16px;
}
.opt.wrong { border-color: var(--line); color: var(--muted); text-decoration: line-through; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 14px; color: var(--muted); }
input[type="text"] {
  font: inherit;
  width: 100%;
  min-height: 52px;
  padding: 12px 16px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--card);
  color: var(--ink);
}
.msg { font-size: 15px; color: var(--wine); min-height: 1.55em; }
.shake { animation: shake 0.3s; }
@keyframes shake {
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}
@media (prefers-reduced-motion: reduce) {
  .tile { transition: none; }
  .shake { animation: none; }
}
.letter { white-space: pre-line; }
.az { display: flex; flex-direction: column; }
.az-row { display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-top: 1px solid var(--line); }
.az-row:last-child { padding-bottom: 0; }
.az-n { font-size: 14px; font-weight: 500; color: var(--muted); }
.az-n b { color: var(--wine); font-weight: 600; }
.az-n span { font-variant-numeric: tabular-nums; }
.az-bar { height: 6px; border-radius: 3px; background: var(--paper); overflow: hidden; }
.az-bar i { display: block; height: 100%; width: 100%; background: var(--wine); transform: scaleX(0); transform-origin: left; }
.az-bar.over i { background: var(--ink); }
.az-tl { position: relative; display: flex; gap: 3px; height: 26px; border-radius: 6px; overflow: hidden; }
.az-tl span { background: var(--paper); font-size: 12px; font-weight: 600; color: var(--muted); display: flex; align-items: center; justify-content: center; }
.az-tl i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--wine); opacity: 0.3; }
.az-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.az-btns .btn { padding: 8px 4px; font-size: 15px; white-space: nowrap; }
.btn.ghost.az-rec { background: var(--wine); border-color: var(--wine); color: #fff; }
.btn:disabled { opacity: 0.45; cursor: default; }
footer {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-start;
  font-size: 13px;
  color: var(--muted);
}
.mark { background: none; border: 0; padding: 6px 0; color: var(--muted); font-size: 13px; }
.author {
  border: 1px dashed var(--muted);
  border-radius: 4px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
}
/* Letter concept — intentionally only two font families. */
.page { padding-left: max(24px, env(safe-area-inset-left)); padding-right: max(24px, env(safe-area-inset-right)); gap: 24px; }
header { text-align: center; gap: 15px; }
.brand { font-size: 36px; font-weight: 500; }
.dateline { font-size: 11px; letter-spacing: .16em; color: var(--muted); }
.steps { flex-wrap: nowrap; gap: 0; border-bottom: 1px solid var(--line); }
.chip { flex: 1; border: 0; border-radius: 0; padding: 10px 4px; }
.chip.now { background: transparent; box-shadow: 0 2px 0 var(--wine); }
main { background: transparent; box-shadow: none; border-radius: 0; padding: 12px 0 24px; gap: 20px; }
h2 { font-size: 29px; font-weight: 500; line-height: 1.25; }
.eyebrow { font-size: 11px; color: var(--muted); }
.btn, .btn.ghost, .opt, input[type="text"] { border-radius: 4px; }
.opt, input[type="text"] { background: transparent; }
.quote { text-align: center; font-family: var(--body); }
.letter { font-family: var(--hand); font-size: 28px; font-weight: 400; font-style: normal; color: var(--ink); white-space: normal; line-height: 1.3; overflow-wrap: break-word; }
.letter p + p { margin-top: .85em; }
.letter .signature { text-align: right; font-size: 30px; margin-top: .85em; }
.letter h2 { font: inherit; }
.letter h2 + p { margin-top: .85em; }
.photo { border: 7px solid var(--card); border-radius: 2px; }
footer { align-items: center; }
#authorBox { width: 100%; }
.mark { font-size: 14px; min-height: 44px; }
.az-bar, .az-tl span { background: var(--line); }
.az-btns .btn { font-size: 13px; min-width: 0; }
.hint { color: var(--wine); font-size: 15px; }
.hint summary { cursor: pointer; padding: 12px 0; }
.hint p { color: var(--muted); }
@media (max-width: 360px) { .page { padding-left: 16px; padding-right: 16px; } .brand { font-size: 30px; } }
/* Personal notes — one shared paper treatment, separate from game UI. */
.letter { background: #fffcf6; padding: 24px; border-radius: 2px; box-shadow: 0 2px 8px rgba(48,38,42,.07); }
.letter.note-photo { padding: 12px 12px 20px; }
.note-photo .photo { border: 0; border-radius: 0; }
.note-photo .photo-caption { margin: 16px 8px 0; text-align: center; }
@media (max-width: 360px) { .letter { padding: 20px; } }
</style>
</head>
<body>
<div class="page">
  <header>
    <p class="dateline">20–24 НОЯБРЯ 2026</p>
    <h1 class="brand">Наша история</h1>
    <div class="steps" id="chips"></div>
  </header>
  <main id="view"></main>
  <footer>
    <div id="authorBox"></div>
    <button class="mark" id="mark" type="button" aria-label="К. для К.">К. для К.</button>
  </footer>
</div>

<script>
/* ================== НАСТРОЙКИ: всё, что меняется, лежит здесь ================== */
var CONFIG = {
  // время открытия глав, по Москве
  open: {
    1: Date.UTC(2026, 10, 20, 16, 0),  // 20 ноября 19:00 МСК
    2: Date.UTC(2026, 10, 21, 9, 0),   // 21 ноября 12:00 МСК
    3: Date.UTC(2026, 10, 22, 16, 0)   // 22 ноября 19:00 МСК
  },
  openText: { 1: "20 ноября в 19:00", 2: "21 ноября в 12:00", 3: "22 ноября в 19:00" },
  photoCaption: "Я уже скучаю по тебе, Катя.",
  firstMessage: ["18072015", "180715"],
  clue1: "Там, где обычно рождается что-то вкусное, сегодня спряталось кое-что для тебя. Только искать нужно чуть ниже.",
  hint1: "Загляни в ящик под духовкой.",
  code1: "МЫСЛЯМИ",
  clue2: "Говорят, сладости перед сном — плохая привычка. А что, если они всё это время были прямо под тобой?",
  hint2: "Загляни под матрас, ближе к изголовью.",
  code2: "ВСЕГДА",
  apozh: {
    src: "clip.mp3",          // фрагмент песни в обычном виде, сайт сам его переворачивает
    cuts: [4, 9, 13],         // границы частей в секундах от начала фрагмента (в обычном, не перевёрнутом виде)
    answers: ["ОКОЛОТЕБЯ"],   // без пробелов, заглавными
    hint: "Подсказка: это поёт Ёлка."
  },
  letter: "Катя, любимая моя!\n\nПока я в отъезде, мне хотелось, чтобы у нас с тобой было что-то общее, несмотря на расстояние. Так и появилась эта маленькая история.\n\nВсё началось с одной случайной встречи на свадьбе и одного сообщения. Кто бы тогда мог подумать, сколько всего нас ждёт впереди.\n\nС тех пор столько всего произошло: наши путешествия, свадьба, совместные планы, маленькие радости и самые обычные вечера дома. Из всего этого и складывается наша история.\n\nКогда я уезжаю, мне особенно не хватает наших вечеров. Возможности обнять тебя перед сном, прижать к себе и уснуть рядом.\n\nИ, конечно, возможности сделать тебе кусь. Ну куда же без этого? Готовься, за эти дни у меня накопится много нерастраченных кусей.\n\nЯ очень люблю нашу жизнь вдвоём. И ещё больше люблю думать о том, сколько всего нам предстоит пережить вместе.\n\nГде бы я ни находился, мыслями я всегда около тебя.\n\nЛюблю тебя, родная. Скоро буду дома.\n\nТвой К.",
  giftPlace: "Год назад мы впервые вместе гуляли по Парижу. С тех пор одна дама живёт у нас в углу комнаты, на колонке. Загляни туда, где она жила, пока мы её не собрали."
};
/* ================================================================================ */

var KEY = "nasha-istoriya-paper-v4";
var state = { step: 0 };
var author = false;
var previewGate = 0;
try {
  var saved = JSON.parse(localStorage.getItem(KEY) || "null");
  if (saved && typeof saved.step === "number") state = saved;
} catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

var view = document.getElementById("view");
function h(html) { view.innerHTML = html; }
function $(id) { return document.getElementById(id); }
function norm(s) { return String(s).toUpperCase().replace(/Ё/g, "Е").replace(/\s+/g, "").trim(); }
function isOpen(ch) { return !(author && previewGate === ch) && (author || Date.now() >= CONFIG.open[ch]); }
function go(n) { previewGate = 0; state.step = n; save(); render(); window.scrollTo(0, 0); }
function next() { go(state.step + 1); }
function todo(t) { return '<span class="todo">' + t + "</span>"; }
function nope(el, msgEl, text) {
  el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
  if (msgEl) msgEl.textContent = text;
}

/* ---------- шаги ---------- */
var STEPS = [];
function step(ch, fn) { STEPS.push({ ch: ch, fn: fn }); }

/* Глава 1 */
step(1, function () {
  if (!isOpen(1)) {
    h('<p class="eyebrow">Скоро</p><h2>История начнётся ' + CONFIG.openText[1] + '</h2>' +
      '<p>Катя, я кое-что для тебя приготовил. Загляни сюда вечером, когда я уже буду в дороге.</p>');
    return;
  }
  h('<p class="eyebrow">Глава 1</p><h2>Как всё началось</h2>' +
    '<div class="letter"><p>Катя,</p><p>пока я катаюсь, у тебя есть своё приключение. Оно про нас двоих, займёт пару вечеров, и в конце тебя кое-что ждёт.</p><p class="signature">Твой К.</p></div>' +
    '<p>Начнём с простого: собери одну фотографию.</p>' +
    '<button class="btn" id="go" type="button">Начать</button>');
  $("go").onclick = next;
});

step(1, function () { puzzle(); });

step(1, function () {
  h('<p class="eyebrow">Глава 1</p>' +
    '<figure class="letter note-photo" style="margin:0"><img class="photo" src="photo.jpg" alt="Мы вдвоём с бокалами шампанского">' +
    '<figcaption class="photo-caption">' + CONFIG.photoCaption + '</figcaption></figure>' +
    '<button class="btn" id="go" type="button">Дальше</button>');
  $("go").onclick = next;
});

step(1, function () {
  choice({
    eyebrow: "Глава 1",
    q: "Где я увидел тебя в первый раз?",
    opts: ["В университете", "На свадьбе моего одногруппника", "ВКонтакте, в рекомендациях", "В гостях у общих друзей"],
    right: 1,
    wrong: "Не там. Вспомни, кто в тот день был в белом.",
    after: "А потом оказалось, что жених приходится тебе двоюродным братом. Лучший повод сходить на чужую свадьбу."
  });
});

step(1, function () {
  choice({
    eyebrow: "Глава 1",
    q: "Сколько мне было лет, когда мы познакомились?",
    opts: ["19", "20", "21", "23"],
    right: 2,
    wrong: "Не угадала. Я тогда был не настолько молод. Или не настолько стар.",
    after: "Двадцать один. Молодой, смелый и решился написать тебе первым."
  });
});

step(1, function () {
  h('<p class="eyebrow">Глава 1</p><h2>Какого числа я написал тебе первое сообщение?</h2>' +
    '<p class="soft">Если не помнишь, переписка ВКонтакте всё хранит.</p>' +
    '<div class="field"><label for="date">Дата, например 01.02.2015</label>' +
    '<input type="text" id="date" inputmode="numeric" autocomplete="off" placeholder="ДД.ММ.ГГГГ"></div>' +
    '<p class="msg" id="msg"></p>' +
    '<button class="btn" id="go" type="button">Проверить</button>');
  $("go").onclick = function () {
    var v = $("date").value.replace(/\D/g, "");
    if (CONFIG.firstMessage.indexOf(v) >= 0) next();
    else nope($("date"), $("msg"), "Не тот день. Пролистай переписку в самое начало.");
  };
});

step(1, function () {
  code({
    eyebrow: "Глава 1",
    title: "18 июля 2015 года",
    text: "С этого сообщения всё и пошло. А теперь оторвись от телефона: в квартире спрятана записка.",
    clue: CONFIG.clue1,
    hint: CONFIG.hint1,
    label: "Слово из записки",
    answer: CONFIG.code1
  });
});

/* Глава 2 */
step(2, function () {
  if (!isOpen(2)) {
    h('<p class="eyebrow">Глава 1 пройдена</p><h2>На сегодня всё</h2>' +
      '<p>Записку сохрани, слово из неё ещё пригодится. Вторая глава откроется ' + CONFIG.openText[2] + '.</p>' +
      '<div class="letter"><p>Спокойной ночи, родная.</p></div>');
    return;
  }
  h('<p class="eyebrow">Глава 2</p><h2>Наш дом</h2>' +
    '<p>Вчера было про начало. Сегодня про то, что мы успели построить вместе. И пара вопросов, на которые ты точно знаешь ответ.</p>' +
    '<button class="btn" id="go" type="button">Поехали</button>');
  $("go").onclick = next;
});

step(2, function () {
  choice({
    eyebrow: "Глава 2 · вопрос 1 из 3",
    q: "В какой день мы поженились?",
    opts: ["18.08.2020", "08.08.2019", "08.08.2020", "20.08.2020"],
    right: 2,
    wrong: "Мне повезло, что это вижу только я. Попробуй ещё.",
    after: "Восьмое августа двадцатого. Две восьмёрки подряд, чтобы я точно не забыл."
  });
});

step(2, function () {
  choice({
    eyebrow: "Глава 2 · вопрос 2 из 3",
    q: "Мы расписались во Дворце бракосочетания №1. Какой у него адрес?",
    opts: ["Дворцовая набережная, д. 28", "Английская набережная, д. 28", "Фурштатская улица, д. 52", "Дворцовая набережная, д. 32"],
    right: 1,
    wrong: "Не там. Вспомни, вдоль какой набережной мы ехали в тот день.",
    after: "Английская набережная, 28. Мраморная лестница, а на ней ты."
  });
});

step(2, function () {
  choice({ eyebrow: "Глава 2 · вопрос 3 из 3", q: "Во сколько состоялась наша церемония бракосочетания?", opts: ["12:30", "13:00", "13:30", "14:00"], right: 2, wrong: "Попробуй ещё.", after: "13:30. Наше время." });
});

step(2, function () {
  code({
    eyebrow: "Глава 2",
    title: "Конечно, помнишь",
    text: "За это полагается награда. Она уже ждёт тебя дома.",
    clue: CONFIG.clue2,
    hint: CONFIG.hint2,
    label: "Слово с открытки",
    answer: CONFIG.code2
  });
});

/* Ложный финал и глава 3 */
var fakeEndStep = STEPS.length;
step(3, function () {
  if (!isOpen(3)) {
    h('<p class="eyebrow">Конец</p><div class="letter"><h2>Вот и вся история.</h2>' +
      '<p>Хотел немного подсластить тебе дни, пока меня нет рядом.</p>' +
      '<p>Люблю тебя. Вернусь двадцать четвёртого.</p><p class="signature">Твой К.</p></div>');
    return;
  }
  h('<p class="eyebrow">Глава 3</p><h2>Постой. Это ещё не всё</h2>' +
    '<p>Ты же не думала, что я уехал на пять дней и оставил тебе только это? У истории есть третья глава. Она про то, что впереди.</p>' +
    '<p>Но сначала тебе нужно найти последний ключ. Он спрятан в одной песне.</p>' +
    '<button class="btn" id="go" type="button">Открыть</button>');
  $("go").onclick = next;
});

step(3, function () { apozh(); });

step(3, function () {
  h('<p class="eyebrow">Глава 3</p><h2>Замок из трёх частей</h2>' +
    '<p>Слово из записки, слово с открытки и название песни. Сложи их по порядку.</p>' +
    '<div class="field"><label for="w1">Слово из первой записки</label><input type="text" id="w1" autocomplete="off"></div>' +
    '<div class="field"><label for="w2">Слово с открытки</label><input type="text" id="w2" autocomplete="off"></div>' +
    '<div class="field"><label for="w3">Название песни</label><input type="text" id="w3" autocomplete="off"></div>' +
    '<p class="msg" id="msg"></p>' +
    '<button class="btn" id="go" type="button">Открыть замок</button>');
  $("go").onclick = function () {
    var bad = null;
    if (norm($("w1").value) !== norm(CONFIG.code1)) bad = $("w1");
    else if (norm($("w2").value) !== norm(CONFIG.code2)) bad = $("w2");
    else if (CONFIG.apozh.answers.indexOf(norm($("w3").value)) < 0) bad = $("w3");
    if (bad) nope(bad, $("msg"), bad.id === "w3" ? "Это не та песня. Вспомни, что ты только что слушала." : bad.id === "w1" ? "Это слово не подходит. Загляни в первую записку ещё раз." : "Это слово не подходит. Загляни в открытку ещё раз.");
    else next();
  };
});

step(3, function () {
  h('<p class="eyebrow">Глава 3</p><h2>Мыслями всегда около тебя</h2>' +
    '<div class="letter">' + CONFIG.letter.split('\n\n').map(function(t,i,a){ return '<p class="' + (i===a.length-1 ? 'signature' : '') + '">' + t + '</p>'; }).join('') + '</div>' +
    '<p class="quote">А теперь иди за подарком.</p>' +
    '<p>' + CONFIG.giftPlace + '</p>');
});

/* ---------- общие виды ---------- */
function choice(c) {
  h('<p class="eyebrow">' + c.eyebrow + '</p><h2>' + c.q + '</h2>' +
    '<div class="opts" id="opts">' + c.opts.map(function (o, i) {
      return '<button class="opt" type="button" data-i="' + i + '">' + o + '</button>';
    }).join("") + '</div><p class="msg" id="msg"></p>');
  $("opts").onclick = function (e) {
    var b = e.target.closest(".opt");
    if (!b) return;
    if (+b.dataset.i === c.right) {
      h('<p class="eyebrow">' + c.eyebrow + '</p><h2>' + c.opts[c.right] + '</h2><p>' + c.after + '</p>' +
        '<button class="btn" id="go" type="button">Дальше</button>');
      $("go").onclick = next;
    } else {
      b.classList.add("wrong"); b.disabled = true;
      nope(b, $("msg"), c.wrong);
    }
  };
}

function code(c) {
  h('<p class="eyebrow">' + c.eyebrow + '</p><h2>' + c.title + '</h2><p>' + c.text + '</p>' +
    '<p>' + (c.hint ? c.clue : todo(c.clue)) + '</p>' +
    (c.hint ? '<details class="hint"><summary>Нужна маленькая подсказка?</summary><p>' + c.hint + '</p></details>' : '') +
    '<div class="field"><label for="code">' + c.label + '</label>' +
    '<input type="text" id="code" autocomplete="off" autocapitalize="characters"></div>' +
    '<p class="msg" id="msg"></p>' +
    '<button class="btn" id="go" type="button">Проверить</button>');
  $("go").onclick = function () {
    if (norm($("code").value) === norm(c.answer)) next();
    else nope($("code"), $("msg"), "Не то слово. Проверь, как оно написано.");
  };
}

/* ---------- пятнашки 3×3 ---------- */
function puzzle() {
  var N = 3, EMPTY = N * N - 1;
  var cells = [];           // cells[position] = tile id
  for (var i = 0; i < N * N; i++) cells.push(i);
  var moves = 0, started = Date.now();

  function neighbors(p) {
    var r = Math.floor(p / N), c = p % N, out = [];
    if (r > 0) out.push(p - N);
    if (r < N - 1) out.push(p + N);
    if (c > 0) out.push(p - 1);
    if (c < N - 1) out.push(p + 1);
    return out;
  }
  function solved() { for (var i = 0; i < cells.length; i++) if (cells[i] !== i) return false; return true; }
  // перемешиваем честными ходами, поэтому пазл всегда собирается
  var e = EMPTY, prev = -1;
  for (var k = 0; k < 60 || solved(); k++) {
    var ns = neighbors(e).filter(function (p) { return p !== prev; });
    var p = ns[Math.floor(Math.random() * ns.length)];
    cells[e] = cells[p]; cells[p] = EMPTY; prev = e; e = p;
  }

  h('<p class="eyebrow">Глава 1</p><h2>Собери фотографию</h2>' +
    '<p class="soft">Нажимай на кусочек рядом с пустой клеткой, он переедет в неё.</p>' +
    '<div class="board" id="board"></div>' +
    '<div class="row"><span class="count" id="count">Ходов: 0</span>' +
    '<button class="btn ghost" id="nums" type="button">Показать номера</button>' +
    '<button class="btn ghost" id="solve" type="button" hidden>Собрать за меня</button></div>');

  var board = $("board"), tiles = {};
  for (var t = 0; t < EMPTY; t++) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "tile";
    b.style.backgroundPosition = (t % N) * 50 + "% " + Math.floor(t / N) * 50 + "%";
    b.setAttribute("aria-label", "Кусочек " + (t + 1));
    b.innerHTML = "<span>" + (t + 1) + "</span>";
    b.dataset.t = t;
    board.appendChild(b); tiles[t] = b;
  }
  function place() {
    cells.forEach(function (id, pos) {
      if (id === EMPTY) return;
      tiles[id].style.left = (pos % N) * 33.3333 + "%";
      tiles[id].style.top = Math.floor(pos / N) * 33.3333 + "%";
    });
  }
  place();
  board.onclick = function (ev) {
    var b = ev.target.closest(".tile");
    if (!b) return;
    var pos = cells.indexOf(+b.dataset.t), emp = cells.indexOf(EMPTY);
    if (neighbors(pos).indexOf(emp) < 0) return;
    cells[emp] = cells[pos]; cells[pos] = EMPTY;
    moves++; $("count").textContent = "Ходов: " + moves;
    place();
    if (moves >= 120 || Date.now() - started > 4 * 60 * 1000) $("solve").hidden = false;
    if (solved()) setTimeout(next, 450);
  };
  $("nums").onclick = function () {
    var on = board.classList.toggle("nums");
    this.textContent = on ? "Скрыть номера" : "Показать номера";
  };
  $("solve").onclick = next;
  if (author) $("solve").hidden = false;
}

/* ---------- апож: песня задом наперёд ---------- */
function apozh() {
  var A = CONFIG.apozh, N = A.cuts.length + 1;
  var ctx = null, sr = 44100, rev = null, orig = null, bounds = [];
  var recs = [], stream = null, recorder = null, recIdx = -1, stopTimer = null;
  var fails = 0, flipped = false, micOff = false;
  var cur = null, recStart = 0, ticking = false;
  var player = new Audio(), lastUrl = null;

  function wav(s) {
    var buf = new ArrayBuffer(44 + s.length * 2), v = new DataView(buf);
    function str(o, t) { for (var i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); }
    str(0, "RIFF"); v.setUint32(4, 36 + s.length * 2, true); str(8, "WAVEfmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, "data"); v.setUint32(40, s.length * 2, true);
    for (var i = 0; i < s.length; i++) {
      var x = Math.max(-1, Math.min(1, s[i]));
      v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7fff, true);
    }
    return new Blob([buf], { type: "audio/wav" });
  }
  function play(s, kind, i) {
    cur = { kind: kind, i: i };
    player.pause();
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = URL.createObjectURL(wav(s));
    player.src = lastUrl;
    player.play().catch(function () {});
  }
  function reversed(s) { var r = new Float32Array(s.length); for (var i = 0; i < s.length; i++) r[i] = s[s.length - 1 - i]; return r; }
  function decode(ab) { return new Promise(function (res, rej) { ctx.decodeAudioData(ab, res, rej); }); }
  function part(i) { return rev.subarray(bounds[i], bounds[i + 1]); }
  // обрезаем тишину по краям записи, чтобы в склейке не было пауз
  function trim(s) {
    var a = 0, b = s.length - 1, T = 0.02;
    while (a < b && Math.abs(s[a]) < T) a++;
    while (b > a && Math.abs(s[b]) < T) b--;
    var pad = Math.floor(sr * 0.05);
    a = Math.max(0, a - pad); b = Math.min(s.length - 1, b + pad);
    return b - a < sr * 0.2 ? s : s.slice(a, b + 1);
  }
  function allDone() { for (var i = 0; i < N; i++) if (!recs[i]) return false; return true; }

  h('<p class="eyebrow">Глава 3</p><h2>Апож</h2>' +
    '<p>Я спрятал песню, перевернув её задом наперёд. Ты слушаешь её по кусочкам и повторяешь в микрофон всё, что слышишь, как можно точнее. Потом я переверну твои записи обратно, и ты попробуешь узнать песню.</p>' +
    '<p class="soft">Включи звук на телефоне и разреши доступ к микрофону, когда браузер спросит.</p>' +
    '<p class="msg" id="msg"></p>' +
    '<button class="btn" id="go" type="button">Начать</button>');
  $("go").onclick = function () {
    $("go").disabled = true; $("msg").textContent = "Загружаю песню…";
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      sr = ctx.sampleRate;
    } catch (e) {}
    if (!ctx) { $("msg").textContent = "Этот браузер не умеет работать со звуком. Открой сайт в Safari или Chrome."; return; }
    fetch(A.src).then(function (r) { return r.arrayBuffer(); }).then(decode).then(function (buf) {
      orig = new Float32Array(buf.getChannelData(0));
      rev = reversed(orig);
      // в перевёрнутой записи части идут с конца песни к началу
      bounds = [0].concat(A.cuts.slice().reverse().map(function (c) { return rev.length - Math.round(c * sr); })).concat([rev.length]);
      micOff = !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
      draw();
    }).catch(function () {
      $("go").disabled = false;
      $("msg").textContent = "Песня не загрузилась. Проверь интернет и нажми ещё раз.";
    });
  };

  function dur(i) { return (bounds[i + 1] - bounds[i]) / sr; }
  function fmt(x) { return x.toFixed(1).replace(".", ","); }
  // полоски: сколько длится кусок, где сейчас звук и сколько уже записано
  function tick() {
    if (!$("az")) { ticking = false; return; }
    var on = cur && !player.paused && !player.ended && player.duration;
    var frac = on ? Math.min(1, player.currentTime / player.duration) : 0;
    $("azfill").style.width = (on && cur.kind === "all" ? frac * 100 : 0) + "%";
    for (var i = 0; i < N; i++) {
      var w = 0, t = fmt(dur(i)) + " с", over = false;
      if (recIdx === i) {
        var e = (Date.now() - recStart) / 1000;
        w = Math.min(1, e / dur(i)); over = e > dur(i);
        t = fmt(e) + " / " + fmt(dur(i)) + " с";
      } else if (on && cur.i === i && cur.kind !== "all") w = frac;
      $("azb" + i).firstChild.style.transform = "scaleX(" + w + ")";
      $("azb" + i).classList.toggle("over", over);
      $("azt" + i).textContent = t;
    }
    requestAnimationFrame(tick);
  }
  function draw(note) {
    var rows = "", tl = "";
    for (var k = 0; k < N; k++) tl += '<span style="flex:' + dur(k).toFixed(2) + '">' + (k + 1) + '</span>';
    for (var i = 0; i < N; i++) {
      var rec = recIdx === i;
      rows += '<div class="az-row"><span class="az-n">Часть ' + (i + 1) + ' · <span id="azt' + i + '">' + fmt(dur(i)) + ' с</span>' + (recs[i] ? " · <b>записана</b>" : "") + '</span>' +
        '<div class="az-bar" id="azb' + i + '"><i></i></div><div class="az-btns">' +
        '<button class="btn ghost" type="button" data-a="hear" data-i="' + i + '"' + (recIdx >= 0 ? " disabled" : "") + '>Слушать</button>' +
        (micOff ? "" : '<button class="btn ghost' + (rec ? " az-rec" : "") + '" type="button" data-a="rec" data-i="' + i + '"' + (recIdx >= 0 && !rec ? " disabled" : "") + '>' + (rec ? "Стоп" : recs[i] ? "Заново" : "Записать") + '</button>') +
        (micOff ? "" : '<button class="btn ghost" type="button" data-a="mine" data-i="' + i + '"' + (recs[i] && recIdx < 0 ? "" : " disabled") + '>Моя запись</button>') +
        '</div></div>';
    }
    var guess = flipped || micOff;
    h('<p class="eyebrow">Глава 3 · апож</p><h2>' + (guess ? "Что это за песня?" : "Повтори, что слышишь") + '</h2>' +
      (micOff ? '<p class="soft">Микрофон здесь недоступен, поэтому просто слушай перевёрнутую песню и угадывай.</p>' : "") +
      '<div class="row"><button class="btn ghost" type="button" data-a="all"' + (recIdx >= 0 ? " disabled" : "") + '>Послушать целиком задом наперёд</button></div>' +
      '<div class="az-tl" id="aztl">' + tl + '<i id="azfill"></i></div>' +
      '<div class="az" id="az">' + rows + '</div>' +
      (!micOff && allDone() ? '<button class="btn" type="button" data-a="flip">Перевернуть мои записи</button>' : "") +
      (guess ? '<div class="field"><label for="song">Название песни</label><input type="text" id="song" autocomplete="off"></div>' +
        '<div class="row"><button class="btn" type="button" data-a="check">Проверить</button>' +
        (fails >= 4 ? '<button class="btn ghost" type="button" data-a="giveup">Сдаюсь, включи оригинал</button>' : "") + '</div>' : "") +
      '<p class="msg" id="msg">' + (note || (fails >= 2 && guess ? A.hint : "")) + '</p>');
    if (!ticking) { ticking = true; requestAnimationFrame(tick); }
  }

  view.onclick = function (e) {
    var b = e.target.closest("[data-a]");
    if (!b || !rev) return;
    var a = b.dataset.a, i = +b.dataset.i;
    if (a === "all") play(rev, "all");
    else if (a === "hear") play(part(i), "part", i);
    else if (a === "mine") play(recs[i], "mine", i);
    else if (a === "rec") { if (recIdx === i) stopRec(); else startRec(i); }
    else if (a === "flip") {
      var len = 0, k;
      for (k = 0; k < N; k++) len += recs[k].length;
      var out = new Float32Array(len), o = 0;
      for (k = N - 1; k >= 0; k--) { out.set(reversed(recs[k]), o); o += recs[k].length; }
      flipped = true; draw(); play(out);
    }
    else if (a === "check") {
      var v = norm($("song").value);
      var ok = A.answers.some(function (x) { return v.indexOf(x) >= 0; });
      if (ok) win(true);
      else { fails++; draw(fails >= 2 ? A.hint : "Не она. Послушай ещё раз."); nope($("song")); }
    }
    else if (a === "giveup") win(false);
  };

  function startRec(i) {
    player.pause();
    var p = stream ? Promise.resolve(stream) : navigator.mediaDevices.getUserMedia({ audio: true });
    p.then(function (s) {
      stream = s;
      var chunks = [];
      recorder = new MediaRecorder(stream);
      recorder.ondataavailable = function (ev) { if (ev.data && ev.data.size) chunks.push(ev.data); };
      recorder.onstop = function () {
        var blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
        recIdx = -1;
        blob.arrayBuffer().then(decode).then(function (buf) {
          recs[i] = trim(new Float32Array(buf.getChannelData(0)));
          flipped = false; draw();
        }).catch(function () { draw("Запись не получилась. Попробуй ещё раз."); });
      };
      recorder.start(); recStart = Date.now();
      recIdx = i; draw("Идёт запись. Повтори услышанное и нажми «Стоп».");
      stopTimer = setTimeout(stopRec, ((bounds[i + 1] - bounds[i]) / sr) * 2500 + 1500);
    }).catch(function () {
      draw("Нет доступа к микрофону. Разреши его в настройках браузера для этого сайта и попробуй снова.");
    });
  }
  function stopRec() {
    clearTimeout(stopTimer);
    if (recorder && recorder.state !== "inactive") recorder.stop();
  }
  function win(guessed) {
    view.onclick = null;
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    h('<p class="eyebrow">Глава 3 · апож</p><h2>' + (guessed ? "Она самая" : "Вот что это было") + '</h2>' +
      '<p>' + (guessed ? "Ты узнала её даже задом наперёд." : "Задом наперёд она сама на себя не похожа, так что это не считается.") + ' Это «Около тебя», и её название — последний ключ к замку.</p>' +
      '<div class="row"><button class="btn ghost" id="orig" type="button">Включить оригинал</button></div>' +
      '<button class="btn" id="go" type="button">Дальше</button>');
    $("orig").onclick = function () { play(orig); };
    $("go").onclick = function () { player.pause(); next(); };
    play(orig);
  }
}

/* ---------- каркас ---------- */
function render() {
  if (state.step >= STEPS.length) state.step = STEPS.length - 1;
  var visibleStep = author && previewGate ? GATES[previewGate] : state.step;
  var s = STEPS[visibleStep];
  view.onclick = null;
  s.fn();
  // третья глава не показывается в списке, пока не откроется: до этого история выглядит законченной
  var show3 = s.ch === 3 && isOpen(3);
  var fakeEnd = s.ch === 3 && !show3;
  var chips = [1, 2].concat(show3 ? [3] : []);
  $("chips").innerHTML = chips.map(function (n) {
    var cls = fakeEnd || n < s.ch ? "done" : n === s.ch ? "now" : "";
    return '<span class="chip ' + cls + '">Глава ' + n + "</span>";
  }).join("");
  $("authorBox").innerHTML = author
    ? '<div class="author"><span>Режим автора: главы открыты без ожидания. Шаг ' + (visibleStep + 1) + " из " + STEPS.length + '.</span>' +
      '<div class="row"><button class="btn ghost" id="aPrev" type="button">Назад</button>' +
      '<button class="btn ghost" id="aNext" type="button">Пропустить шаг</button>' +
      '<button class="btn ghost" id="aReset" type="button">Сбросить прогресс</button></div>' +
      '<p>Предпросмотр экранов ожидания</p><div class="row">' +
      '<button class="btn ghost" id="aWait1" type="button">До главы 1</button>' +
      '<button class="btn ghost" id="aWait2" type="button">До главы 2</button>' +
      '<button class="btn ghost" id="aFake" type="button">Ложный финал (до главы 3)</button>' +
      (previewGate ? '<button class="btn ghost" id="aReturn" type="button">Вернуться к прохождению</button>' : '') + '</div></div>'
    : "";
  if (author) {
    function preview(ch) { previewGate = ch; render(); window.scrollTo(0, 0); }
    $("aWait1").onclick = function () { preview(1); };
    $("aWait2").onclick = function () { preview(2); };
    $("aFake").onclick = function () { preview(3); };
    if (previewGate) $("aReturn").onclick = function () { preview(0); };
    $("aPrev").onclick = function () { go(Math.max(0, state.step - 1)); };
    $("aNext").onclick = function () { go(Math.min(STEPS.length - 1, state.step + 1)); };
    $("aReset").onclick = function () { go(0); };
  }
}

// пять быстрых нажатий на подпись внизу включают режим автора
var taps = 0, tapTimer = null;
$("mark").onclick = function () {
  taps++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(function () { taps = 0; }, 1500);
  if (taps >= 5) { taps = 0; author = !author; previewGate = 0; render(); }
};

// экраны ожидания сами сменятся, когда придёт время
var GATES = { 1: 0, 2: STEPS.findIndex(function(s) { return s.ch === 2; }), 3: fakeEndStep };
var wasOpen = {};
setInterval(function () {
  if (author && previewGate) return;
  var s = STEPS[state.step];
  if (state.step !== GATES[s.ch]) return;
  var now = isOpen(s.ch);
  if (now && wasOpen[s.ch] === false) render();
  wasOpen[s.ch] = now;
}, 20000);

render();
(function () { var s = STEPS[state.step]; wasOpen[s.ch] = isOpen(s.ch); })();
</script>
